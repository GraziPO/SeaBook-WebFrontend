<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>

    <title>Não foi possível concluir - SeaBook</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/favicon-32.png}">
    <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <span class="logo"><img th:src="@{/images/seabook-logo.svg}" alt="SeaBook" width="244" height="56"></span>
        <div class="auth-subtitle" th:text="'Erro ' + ${status}">Erro</div>

        <div class="auth-error" th:text="${mensagem}">Mensagem</div>

        <div class="auth-footer-link">
            <a href="javascript:history.back()">Voltar</a>
            &nbsp;·&nbsp;
            <a th:href="@{/}">Ir para a página inicial</a>

    </div>
