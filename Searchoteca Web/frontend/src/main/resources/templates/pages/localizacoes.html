<!DOCTYPE html>
<!-- ACERVO / LOCALIZAÇÕES: mesmo modelo de Departamentos (lista + modal de incluir/editar). -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: page(title='Localizações', active='acervo/localizacoes',
                                       content=~{::content}, modals=~{::modals})}">
<body>

<section th:fragment="content">
    <div th:replace="~{components/ui :: pageHead(crumb='ACERVO / LOCALIZAÇÕES', title='Localizações', actions=~{::headActions})}"></div>

    <th:block th:if="${not #lists.isEmpty(pagina.content())}">
        <table class="data-table">
            <thead>
            <tr><th>Código</th><th>Nome</th><th>Departamento</th><th>Descrição</th><th th:if="${nav.manageArchive()}">Ações</th></tr>
            </thead>
            <tbody>
            <tr th:each="l : ${pagina.content()}">
                <td class="mono" th:text="${l.localCode}">D1</td>
                <td th:text="${l.localName}">Estante 1</td>
                <td class="mono" th:text="${l.departCode}">CIE</td>
                <td th:text="${l.localDesc}">Corredor B</td>
                <td class="actions-cell" th:if="${nav.manageArchive()}">
                    <button type="button" class="btn-edit" data-open-modal="modal-localizacao"
                            th:data-form-action="@{/acervo/localizacoes/{c}/editar(c=${l.localCode})}"
                            data-title="Editar localização" data-submit-label="Salvar" data-readonly="localCode"
                            th:data-f-local-code="${l.localCode}" th:data-f-local-name="${l.localName}"
                            th:data-f-depart-code="${l.departCode}" th:data-f-local-desc="${l.localDesc}">Editar</button>
                    <button type="button" class="btn-delete" data-open-modal="modal-confirmar"
                            th:data-form-action="@{/acervo/localizacoes/{c}/excluir(c=${l.localCode})}"
                            data-title="Excluir localização" data-submit-label="Excluir"
                            th:data-message="|Excluir a localização ${l.localCode}? Só é possível se não houver exemplares nela.|">Excluir</button>
                </td>
            </tr>
            </tbody>
        </table>
        <nav th:replace="~{components/ui :: pagination(pg=${pagina}, url='/acervo/localizacoes')}"></nav>
    </th:block>
    <th:block th:if="${#lists.isEmpty(pagina.content())}">
        <div th:replace="~{components/ui :: empty(title='Nenhuma localização cadastrada', text='Cadastre um departamento antes, e depois as localizações dele.')}"></div>
    </th:block>
</section>

<button th:fragment="headActions" type="button" class="btn-solid" th:if="${nav.manageArchive()}"
        data-open-modal="modal-localizacao" th:data-form-action="@{/acervo/localizacoes}"
        data-title="Incluir localização" data-submit-label="Incluir">+ Incluir localização</button>

<th:block th:fragment="modals">
    <dialog th:replace="~{components/modal :: modal(id='modal-localizacao', title='Incluir localização', body=~{::locationForm})}"></dialog>
</th:block>

<form th:fragment="locationForm" method="post" th:action="@{/acervo/localizacoes}" class="data-form">
    <input type="hidden" name="returnTo" th:value="${currentUri}">
    <div th:replace="~{components/ui :: modalError}"></div>
    <div>
        <label for="loc-codigo">Código</label>
        <input id="loc-codigo" type="text" name="localCode" required maxlength="20" autocomplete="off">
    </div>
    <div>
        <label for="loc-nome">Nome</label>
        <input id="loc-nome" type="text" name="localName" required maxlength="100">
    </div>
    <div class="field-full">
        <label for="loc-depto">Departamento</label>
        <select id="loc-depto" name="departCode" required>
            <option value="">Selecione…</option>
            <option th:each="d : ${departamentos}" th:value="${d.departCode}"
                    th:text="|${d.departCode} — ${d.departName}|">CIE — Ciências</option>
        </select>
    </div>
    <div class="field-full">
        <label for="loc-descricao">Descrição</label>
        <textarea id="loc-descricao" name="localDesc" rows="3"></textarea>
    </div>
    <div class="form-actions">
        <button type="button" class="btn-outline" data-close-modal>Cancelar</button>
        <button type="submit" class="btn-solid" data-modal-submit>Incluir</button>
    </div>
</form>

</body>
</html>
