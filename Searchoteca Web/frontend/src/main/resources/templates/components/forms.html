<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ===================================================================== alterar senha (global) -->
<th:block th:fragment="passwordModal" th:if="${currentUser}">
    <dialog th:replace="~{components/modal :: modal(id='modal-senha', title='Alterar senha', body=~{components/forms :: passwordForm})}"></dialog>
    <!-- reabre sozinho se a troca falhou -->
    <button type="button" hidden data-auto-open data-open-modal="modal-senha" th:if="${abrirModal == 'modal-senha'}"></button>
</th:block>

<form th:fragment="passwordForm" th:action="@{/conta/senha}" method="post" class="data-form">
    <input type="hidden" name="returnTo" th:value="${currentUri}">
    <div class="field-full alert alert-error" data-modal-error th:if="${erroSenha}" th:text="${erroSenha}"></div>
    <div class="field-full">
        <label for="senha-atual">Senha atual</label>
        <input id="senha-atual" type="password" name="currentPassword" required autocomplete="current-password">
    </div>
    <div>
        <label for="senha-nova">Nova senha</label>
        <input id="senha-nova" type="password" name="newPassword" required minlength="8" maxlength="72" autocomplete="new-password">
        <div class="hint">Ao menos 8 caracteres, com letras e números.</div>
    </div>
    <div>
        <label for="senha-confirma">Confirme a nova senha</label>
        <input id="senha-confirma" type="password" name="confirmPassword" required minlength="8" maxlength="72" autocomplete="new-password">
    </div>
    <p class="field-full hint">Depois da troca, você vai precisar entrar de novo com a senha nova.</p>
    <div class="form-actions">
        <button type="button" class="btn-outline" data-close-modal>Cancelar</button>
        <button type="submit" class="btn-solid">Alterar senha</button>
    </div>
</form>

<!-- ===================================================================== novo aluno
     Usado em Usuários (root e administrador de usuários) e em Empréstimos (cadastro no balcão, pelo
     operador de empréstimo). returnTo: para onde voltar depois de salvar (e, em caso de erro, com o
     modal "modal-aluno" reaberto, que precisa existir nessa tela). -->
<form th:fragment="studentForm(returnTo)" method="post" th:action="@{/alunos}" class="data-form">
    <input type="hidden" name="returnTo" th:value="${returnTo}">
    <div th:replace="~{components/ui :: modalError}"></div>
    <div class="field-full">
        <label for="al-nome">Nome completo</label>
        <input id="al-nome" type="text" name="completeName" required maxlength="100">
    </div>
    <div>
        <label for="al-ra">RA</label>
        <input id="al-ra" type="text" name="ra" required maxlength="30" autocomplete="off">
    </div>
    <div>
        <label for="al-telefone">Telefone</label>
        <input id="al-telefone" type="tel" name="phone" maxlength="20" placeholder="(11) 90000-0000">
    </div>
    <div>
        <label for="al-usuario">Usuário</label>
        <input id="al-usuario" type="text" name="username" required maxlength="30" autocomplete="off">
    </div>
    <div>
        <label for="al-email">E-mail</label>
        <input id="al-email" type="email" name="email" required maxlength="100">
    </div>
    <p class="field-full modal-hint">A senha inicial é o <strong>RA</strong>. O aluno é obrigado a trocá-la no primeiro acesso.</p>
    <div class="form-actions">
        <button type="button" class="btn-outline" data-close-modal>Cancelar</button>
        <button type="submit" class="btn-solid">Cadastrar aluno</button>
    </div>
</form>

</body>
</html>
