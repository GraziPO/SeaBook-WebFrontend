<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  ETIQUETA DO EXEMPLAR: título, "Exemplar N · Autor" (+ preço), código de barras e o código em texto.
  Preço: só com o módulo de vendas ligado (nav.salesEnabled, configuração do root) e se o livro tiver
  preço. Sai como texto, à direita; o código de barras continua só ISBN + número do exemplar.
  O código é ISBN + número do exemplar e não muda quando o exemplar troca de lugar; por isso a
  etiqueta não traz a localização (ficaria desatualizada depois de uma movimentação).
  Tamanho fixo de 50 × 30 mm (css/app.css e js/labels.js).
-->
<div th:fragment="label(e)" class="copy-label" th:attr="data-label-code=${e.code()}">
    <div class="copy-label-title" th:text="${e.title()}" th:title="${e.title()}">Vidas Secas</div>
    <div class="copy-label-meta">
        <span class="copy-label-meta-text"
              th:text="${e.author() != null and !#strings.isEmpty(e.author())} ? |Exemplar ${e.copyIndex()} · ${e.author()}| : |Exemplar ${e.copyIndex()}|">Exemplar 2 · Graciliano Ramos</span>
        <span class="copy-label-price" th:if="${nav != null and nav.salesEnabled() and e.salePrice() != null}"
              th:text="|R$ ${#numbers.formatDecimal(e.salePrice(), 1, 'POINT', 2, 'COMMA')}|">R$ 39,90</span>
    </div>
    <div class="copy-label-bars">
        <svg class="barcode" th:attr="data-code=${e.code()}" role="img" th:aria-label="|Código de barras ${e.code()}|"></svg>
    </div>
    <div class="copy-label-code" th:text="${e.code()}">151616565615CIED13</div>
</div>


<!--
  ETIQUETA DA LOCALIZAÇÃO (para colar na prateleira): nome, departamento, código de barras e o código.
  O leitor lê o código da localização direto nos campos de busca (ex.: Movimentações).
  l = localização (localCode, localName, departCode); d = departamento dela (pode ser null).
-->
<div th:fragment="locationLabel(l, d)" class="copy-label" th:attr="data-label-code=${l.localCode}">
    <div class="copy-label-title" th:text="${l.localName}" th:title="${l.localName}">Estante 01 · Prateleira 1</div>
    <div class="copy-label-meta"
         th:text="${d != null} ? |${d.departCode} — ${d.departName}| : ${l.departCode}">LITBR — Literatura Brasileira</div>
    <div class="copy-label-bars">
        <svg class="barcode" th:attr="data-code=${l.localCode}" role="img" th:aria-label="|Código de barras ${l.localCode}|"></svg>
    </div>
    <div class="copy-label-code" th:text="${l.localCode}">LITBR-E01P1</div>
</div>

</body>
</html>
