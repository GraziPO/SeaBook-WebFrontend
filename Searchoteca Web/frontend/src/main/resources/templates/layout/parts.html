<!DOCTYPE html>
<!-- Pedaços fixos da casca (usados só pelo layout/app.html). -->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- ===================================================================== topo -->
<header th:fragment="topbar" class="topbar">
    <a th:href="@{/}" class="logo">Searchoteca</a>
    <div class="topbar-right" th:if="${currentUser}">
        <div class="topbar-user">
            <span class="topbar-name" th:text="${currentUser}">usuário</span>
            <span class="topbar-role" th:text="${currentRoleLabel}">perfil</span>
        </div>
        <button type="button" class="topbar-link link-button" data-open-modal="modal-senha">Alterar senha</button>
        <a th:href="@{/logout}" class="avatar-btn" title="Sair" aria-label="Sair">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </a>
    </div>
    <div class="topbar-right" th:unless="${currentUser}">
        <a th:href="@{/login}" class="btn-outline btn-small">Entrar</a>
    </div>
</header>


<!-- ===================================================================== menu lateral
     active: "dashboard", "usuarios", "acervo/consulta", "acervo/departamentos", "saidas/registro",
             "saidas/comprovantes", "vendas", "emprestimos", "relatorios"...
     Um grupo (ACERVO, SAÍDAS) abre os subitens quando uma tela dele está ativa.
     Os links aparecem conforme o perfil (RoleAccess); quem bloqueia de verdade é o backend. -->
<nav th:fragment="sidebar(active)" class="sidebar" aria-label="Menu principal"
     th:with="act=${active == null ? '' : active}">

    <a th:if="${nav.student()}" th:href="@{/meus-emprestimos}" class="sidebar-item"
       th:classappend="${act == 'meus'} ? 'active'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        MEUS EMPRÉSTIMOS
    </a>

    <a th:if="${nav.dashboard()}" th:href="@{/dashboard}" class="sidebar-item"
       th:classappend="${act == 'dashboard'} ? 'active'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
        DASHBOARD
    </a>

    <a th:if="${nav.users()}" th:href="@{/usuarios}" class="sidebar-item"
       th:classappend="${act == 'usuarios'} ? 'active'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        USUÁRIOS
    </a>

    <!-- ACERVO: a consulta é a tela inicial e fica para todos; o resto, conforme o perfil -->
    <a th:href="@{/acervo/consulta}" class="sidebar-item"
       th:classappend="${#strings.startsWith(act, 'acervo')} ? 'active'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        ACERVO
    </a>
    <div class="sidebar-sub" th:if="${#strings.startsWith(act, 'acervo')}">
        <a th:href="@{/acervo/consulta}" th:classappend="${act == 'acervo/consulta'} ? 'active'">Consulta</a>
        <th:block th:if="${nav.archive()}">
            <a th:href="@{/acervo/livros}" th:classappend="${act == 'acervo/livros'} ? 'active'">Livros</a>
            <a th:href="@{/acervo/departamentos}" th:classappend="${act == 'acervo/departamentos'} ? 'active'">Departamentos</a>
            <a th:href="@{/acervo/localizacoes}" th:classappend="${act == 'acervo/localizacoes'} ? 'active'">Localizações</a>
            <a th:href="@{/acervo/exemplares}" th:classappend="${act == 'acervo/exemplares'} ? 'active'">Exemplares</a>
        </th:block>
    </div>

    <a th:if="${nav.loans()}" th:href="@{/emprestimos}" class="sidebar-item"
       th:classappend="${act == 'emprestimos'} ? 'active'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        EMPRÉSTIMOS
    </a>

    <!-- SAÍDAS: doação e baixa + consulta de comprovantes (a venda tem aba própria) -->
    <th:block th:if="${nav.exits()}">
        <a th:href="@{/saidas}" class="sidebar-item"
           th:classappend="${#strings.startsWith(act, 'saidas')} ? 'active'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="13" y2="17"></line></svg>
            SAÍDAS
        </a>
        <div class="sidebar-sub" th:if="${#strings.startsWith(act, 'saidas')}">
            <a th:href="@{/saidas}" th:classappend="${act == 'saidas/registro'} ? 'active'">Saídas</a>
            <a th:href="@{/saidas/comprovantes}" th:classappend="${act == 'saidas/comprovantes'} ? 'active'">Comprovantes</a>
        </div>
    </th:block>

    <!-- VENDAS: só aparece com o módulo ligado nas configurações do root -->
    <a th:if="${nav.sales()}" th:href="@{/vendas}" class="sidebar-item"
       th:classappend="${act == 'vendas'} ? 'active'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path></svg>
        VENDAS
    </a>

    <a th:if="${nav.audit()}" th:href="@{/relatorios/auditoria}" class="sidebar-item"
       th:classappend="${act == 'relatorios'} ? 'active'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
        RELATÓRIOS
    </a>
</nav>

</body>
</html>
